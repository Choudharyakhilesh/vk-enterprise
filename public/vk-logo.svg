<svg width="120" height="80" viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
  <!-- VK Logo Design Based on Reference -->
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- V Letter in Blue -->
  <path d="M 15 20 L 30 60 L 37 60 L 25 25 L 37 60 L 45 60 L 30 20 L 23 20 L 35 55 L 23 20 Z" 
        fill="url(#blueGradient)" 
        stroke="none"/>
  
  <!-- K Letter in Red/Blue Split -->
  <!-- Vertical part of K in Blue -->
  <rect x="55" y="20" width="8" height="40" 
        fill="url(#blueGradient)" 
        stroke="none"/>
  
  <!-- Diagonal parts of K in Red -->
  <path d="M 63 40 L 85 20 L 78 20 L 63 35 Z" 
        fill="url(#redGradient)" 
        stroke="none"/>
  <path d="M 63 40 L 85 60 L 78 60 L 63 45 Z" 
        fill="url(#redGradient)" 
        stroke="none"/>
  
  <!-- VK Text Below -->
  <text x="60" y="75" 
        font-family="Arial, sans-serif" 
        font-size="12" 
        font-weight="bold" 
        text-anchor="middle" 
        fill="#1f2937">VK IMPORTS</text>
</svg>